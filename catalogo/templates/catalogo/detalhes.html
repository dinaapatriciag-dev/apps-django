{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes</title>
    <link rel="stylesheet" href="{% static 'catalogo/css/style.css' %}">
</head>
<body>
    <div class="card">
        <h1>{{obra.titulo}}</h1>
        <p>Tipo: {{obra.tipo}}</p>
        <p>Ano: {{obra.ano}}</p>
        <p>Gênero: {{obra.genero}}</p>
        <p>Descrição: {{obra.descricao}}</p>

        <a class="btn" href="{% url 'catalogo:index' %}">Voltar para catalogo</a>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>
</head>
<body>

    <h1>Catálogo de Filmes e Séries</h1>

    {% if obras %}

        {% for obra in obras %}

            <h2>{{ obra.titulo }}</h2>

            <p>{{ obra.tipo }}</p>

            <a href="{% url 'catalogo:detalhes' obra.id %}">Ver detalhes</a>

            <hr>

        {% endfor %}

    {% else %}

        <p>Nenhuma obra encontrada.</p>

    {% endif %}

</body>
</html>
